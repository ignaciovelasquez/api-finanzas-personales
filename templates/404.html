<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página No Encontrada</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container { max-width: 450px; padding: 2rem; }
        .error-code { font-size: 5rem; font-weight: 800; color: #f43f5e; margin: 0; }
        h2 { margin: 0.5rem 0 1rem; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <p class="error-code">404</p>
        <h2>Recurso no encontrado</h2>
        <p>La ruta que intentas consultar no existe en este servidor.</p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
